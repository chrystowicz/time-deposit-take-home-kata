openapi: 3.0.3
info:
  title: Time Deposit API
  description: >
    XA Bank time deposit management API. This file is the single source of
    truth for the contract -- the server-side interfaces under
    org.ikigaidigital.adapters.web.generated are generated from it at build
    time (see build.gradle.kts's openApiGenerate task), and
    TimeDepositController implements the generated interface rather than
    declaring its own routing annotations.
  version: "1.0"
paths:
  /v1/time-deposits:
    get:
      operationId: getAllTimeDeposits
      tags:
        - TimeDeposits
      summary: Retrieve every time deposit in the database, with its withdrawals.
      responses:
        "200":
          description: Every time deposit currently in the database.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeDepositResponse"
  /v1/time-deposits/balance-updates:
    post:
      operationId: updateBalances
      tags:
        - TimeDeposits
      summary: Apply this period's interest to every time deposit in the database.
      responses:
        "204":
          description: Balances were updated successfully. No response body.
components:
  schemas:
    TimeDepositResponse:
      type: object
      required:
        - id
        - planType
        - balance
        - days
        - withdrawals
      properties:
        id:
          type: integer
        planType:
          type: string
        balance:
          type: number
        days:
          type: integer
        withdrawals:
          type: array
          items:
            $ref: "#/components/schemas/WithdrawalResponse"
    WithdrawalResponse:
      type: object
      required:
        - amount
        - date
      properties:
        amount:
          type: number
        date:
          type: string
          format: date
